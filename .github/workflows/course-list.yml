name: Course list

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Build the list
        run: python3 tools/build-course-list.py --output roundreplay/courses-v1.json
      - name: Commit when changed
        run: |
          if [ -n "$(git status --porcelain roundreplay/courses-v1.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add roundreplay/courses-v1.json
            git commit -m "Update course list"
            git pull --rebase
            git push
          fi
